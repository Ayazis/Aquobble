name: Build and deploy

# main → site root of the gh-pages branch: https://ayazis.github.io/Aquobble/
# PRs  → preview at /pr/pr-<number>/ on the same branch, removed when the PR closes.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: site
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: site
          path: dist
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr/

  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: site
          path: dist
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          umbrella-dir: pr
          action: deploy
          # The action comments as soon as gh-pages is pushed, before Pages has published it.
          # The steps below wait for the Pages build and post the comment themselves.
          comment: false
      - name: Wait for GitHub Pages to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git ls-remote origin refs/heads/gh-pages | cut -f1)
          for i in $(seq 1 60); do
            read -r commit status < <(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '"\(.commit) \(.status)"')
            echo "Pages build for ${commit:0:7}: $status"
            if [ "$commit" = "$sha" ] && [ "$status" = "built" ]; then exit 0; fi
            if [ "$commit" = "$sha" ] && [ "$status" = "errored" ]; then exit 1; fi
            sleep 10
          done
          echo "Timed out waiting for Pages"; exit 1
      - name: Comment preview link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr/pr-${{ github.event.number }}/"
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --edit-last --create-if-none \
            --body "🚀 Preview is live: $url (commit ${{ github.event.pull_request.head.sha }})"

  preview-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rossjrw/pr-preview-action@v1
        with:
          umbrella-dir: pr
          action: remove
